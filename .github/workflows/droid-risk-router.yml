name: Droid Risk Router

# Risk-based review routing: a read-only `droid exec` scores the PR, deterministic path
# rules apply floors/caps, and the shell step labels the PR `auto-merge-eligible` or
# `needs-human-review`. High risk fails this check so branch protection can block merge.
# The same script runs from Jenkins (see ./Jenkinsfile); nothing here is GitHub-specific
# except how the PR number and tokens arrive.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: risk-router-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  route:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head with history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install Droid CLI
        run: |
          curl -fsSL https://app.factory.ai/cli | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.factory/bin" >> "$GITHUB_PATH"

      - name: Score and route the pull request
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
          RISK_THRESHOLD_LOW: ${{ vars.RISK_THRESHOLD_LOW || '30' }}
          RISK_THRESHOLD_HIGH: ${{ vars.RISK_THRESHOLD_HIGH || '70' }}
          RISK_AUTO_MERGE: ${{ vars.RISK_AUTO_MERGE || 'false' }}
        run: |
          droid --version
          ./scripts/risk-router.sh

      - name: Upload routing decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risk-router-pr-${{ github.event.pull_request.number }}
          path: risk-router/
          if-no-files-found: ignore
